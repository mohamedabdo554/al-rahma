<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>عيادة الرحمة البيطرية</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#10b981" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="apple-mobile-web-app-title" content="الرحمة" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <noscript>
      <div style="display:flex;min-height:100vh;align-items:center;justify-content:center;padding:2rem;text-align:center;font-family:sans-serif;">
        <div><h2 style="font-size:1.2rem;margin-bottom:0.5rem;">⚠️ عذراً</h2><p style="color:#666;font-size:0.9rem;">يجب تفعيل JavaScript في المتصفح</p></div>
      </div>
    </noscript>
    <script>document.documentElement.setAttribute("data-theme",localStorage.getItem("vet_theme")||"light")</script>
    <div id="root"></div>
    <script>navigator.serviceWorker&&navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(s){s.unregister()})});window.caches&&caches.keys().then(function(k){k.forEach(function(n){caches.delete(n)})});</script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
